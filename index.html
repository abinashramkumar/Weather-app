<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
    <link rel="stylesheet" href="abinash.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">  </head>
    <link rel="icon" href="profile.jpg">
<body>

    <div class="container">
        <div class="search-box">
            <input type="text" id="cityInput" placeholder="Enter city name">
            <button id="searchButton">Search</button>
        </div>

        <div class="weather-info">
            <div class="city-name" id="cityName"></div>
            <div class="temperature" id="temperature"></div>
            <div class="weather-description" id="weatherDescription"></div>
            <div class="humidity" id="humidity"></div>
            <div class="wind" id="wind"></div>
            <div class="icon" id="weatherIcon"></div> <div class="date" id="date"></div>

        </div>
    </div>
    <script src="abinash.js"></script>
    <footer>
        <div class="footer-content">
            <div class="copyright">
                &copy;2025  All rights reserved by Abinash.R 
                </div>   
        </div>
    </footer>  
</body>
</html>
